name: Database backup

# Runs daily at 2am Boise time (09:00 UTC) plus manual trigger.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    # Prevents failures until you set secrets/vars
    if: ${{ vars.ENABLE_DB_BACKUP == 'true' }}
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      BACKUP_PROVIDER: ${{ vars.BACKUP_PROVIDER }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate filenames
        run: |
          echo "BACKUP_FILE=db-$(date -u +%Y%m%dT%H%M%SZ).dump" >> $GITHUB_ENV
          echo "BACKUP_OBJECT=backups/$BACKUP_FILE" >> $GITHUB_ENV

      - name: Dump database
        run: pg_dump --format=custom --file="$BACKUP_FILE" "$BACKUP_DATABASE_URL"

      - name: Authenticate to Google Cloud
        if: ${{ env.BACKUP_PROVIDER == 'gcs' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: ${{ env.BACKUP_PROVIDER == 'gcs' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Upload dump to GCS
        if: ${{ env.BACKUP_PROVIDER == 'gcs' }}
        run: gsutil cp "$BACKUP_FILE" "gs://${BACKUP_BUCKET}/${BACKUP_OBJECT}"

      - name: Cleanup
        run: rm -f "$BACKUP_FILE"
