name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pipelineiq
  WORKER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pipelineiq
  REDIS_URL: redis://localhost:6379
  NODE_ENV: test
  DEV_USER_ID: ci-user
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
  CLERK_SECRET_KEY: sk_test_ci
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_ci
  SUPABASE_SERVICE_ROLE_KEY: service_role_ci
  STRIPE_SECRET_KEY: sk_test_ci
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  STRIPE_PRO_PRICE_ID: price_ci
  STRIPE_WEBHOOK_SECRET: whsec_ci

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipelineiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install app dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix apps/worker ci

      - name: Apply SQL migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: npm run worker:typecheck

      - name: Test (web)
        run: npm run web:test

      - name: Test (worker)
        run: npm run worker:test

      - name: Build Docker image
        run: docker build -t pipelineiq:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_ENV_VARS: ${{ vars.CLOUD_RUN_ENV_VARS }}
      DEPLOY_IMAGE_NAME: ${{ vars.DEPLOY_IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build, push, and deploy to Cloud Run
        run: |
          : "${GCP_PROJECT_ID:?Set repo variable GCP_PROJECT_ID}"
          : "${GCP_REGION:?Set repo variable GCP_REGION}"
          : "${CLOUD_RUN_SERVICE:?Set repo variable CLOUD_RUN_SERVICE}"

          REPOSITORY="${GCP_ARTIFACT_REPOSITORY:-pipelineiq}"
          IMAGE_NAME="${DEPLOY_IMAGE_NAME:-pipelineiq-web}"
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          RUNTIME_ENV_VARS="NODE_ENV=production,SENTRY_RELEASE=${GITHUB_SHA}"
          if [ -n "${CLOUD_RUN_ENV_VARS:-}" ]; then
            RUNTIME_ENV_VARS="${RUNTIME_ENV_VARS},${CLOUD_RUN_ENV_VARS}"
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --image "${IMAGE_URI}" \
            --allow-unauthenticated \
            --set-env-vars "${RUNTIME_ENV_VARS}"
